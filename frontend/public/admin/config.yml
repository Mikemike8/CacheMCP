backend:
  name: git-gateway
  branch: main

media_folder: "frontend/public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - name: "events"
        label: "Events"
        file: "frontend/content/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "Examples: May 28, 2026 or Every Friday" }
              - { label: "Time", name: "time", widget: "string", hint: "Example: 5:00 P.M. - 8:00 P.M." }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
